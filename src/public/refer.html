<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Refer and Earn · Ink Kulture</title>
<meta name="description" content="Your Ink Kulture referral code, share link and store credit.">
<meta name="theme-color" content="#0a0a0c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0c;--paper:#f7f5f1;--card:#fff;--line:#e6e2da;--mut:#6b6760;--ok:#13804b;--bad:#b42318;--warn:#a15c07;--accent:#0a0a0c;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:0;z-index:5;background:rgba(247,245,241,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
header svg{height:20px;width:auto;display:block}
header .grow{flex:1}
.btn{appearance:none;border:0;border-radius:999px;background:var(--ink);color:#fff;font:600 15px/1 Inter,sans-serif;padding:14px 20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:9px 14px;min-height:38px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.full{width:100%}
.hero{padding:36px 0 8px}
.eyebrow{display:inline-block;font:700 11px/1 Inter;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:#fff;padding:7px 10px;border-radius:999px}
h1{font-size:clamp(30px,7vw,46px);line-height:1.05;letter-spacing:-.02em;margin:14px 0 10px;font-weight:800}
h2{font-size:20px;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 6px}
.lede{font-size:17px;color:#3c3934;margin:0 0 20px;max-width:560px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0}
.grid{display:grid;gap:12px}
.grid+.grid{margin-top:12px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:620px){.g3{grid-template-columns:1fr}.g2.keep{grid-template-columns:repeat(2,1fr)}.g2:not(.keep){grid-template-columns:1fr}}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.step b.n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;margin-bottom:8px}
.deal{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--ink);border-radius:var(--r);overflow:hidden;margin:14px 0}
.deal>div{padding:16px}
.deal>div+div{border-left:1.5px solid var(--ink)}
.deal .k{font:700 11px/1 Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.deal .v{font-size:26px;font-weight:800;margin:6px 0 2px;letter-spacing:-.01em}
.deal .s{font-size:13px;color:var(--mut)}
@media(max-width:520px){.deal{grid-template-columns:1fr}.deal>div+div{border-left:0;border-top:1.5px solid var(--ink)}}
.rules li{margin:6px 0}
.rules{padding-left:20px;margin:6px 0}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 0}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:16px Inter,sans-serif;background:#fff;color:var(--ink)}
label.f input:focus,label.f textarea:focus{outline:none;border-color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin:14px 0;color:#3c3934}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--ink)}
.mut{color:var(--mut)} .small{font-size:13px}
.err{color:var(--bad);font-size:14px;margin:10px 0 0;min-height:1em}
.ok{color:var(--ok)}
.tabs{display:flex;gap:6px;background:#ebe7df;border-radius:999px;padding:4px;margin:18px 0 6px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:10px;font:600 14px Inter;cursor:pointer;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.otp{display:flex;gap:10px;justify-content:center;margin:14px 0}
.otp input{width:56px;height:62px;text-align:center;font:700 26px Inter;border:1.5px solid var(--line);border-radius:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.01em}
.stat .l{font-size:12.5px;color:var(--mut)}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--ink);color:#fff;border-radius:14px;padding:12px 12px 12px 16px}
.linkbox code{flex:1;font:600 14px ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbox .btn{background:#fff;color:var(--ink);min-height:36px;padding:8px 14px;font-size:13px}
.pill{display:inline-block;font:600 12px/1 Inter;padding:6px 9px;border-radius:999px;background:#efece6;color:#3c3934;white-space:nowrap}
.pill.delivered{background:#e3f4ea;color:var(--ok)} .pill.refused,.pill.cancelled{background:#fdecea;color:var(--bad)} .pill.ofd{background:#fff4dc;color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11.5px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.choice button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.choice button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.choice .v{font-size:24px;font-weight:800}
.note{background:#fff8e6;border:1px solid #f1d79a;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#5c4510}
.hide{display:none!important}
footer{text-align:center;color:var(--mut);font-size:12.5px;padding:24px 16px}
.big{font:800 34px/1 Inter;letter-spacing:.04em;font-family:ui-monospace,Menlo,monospace}
.codebox{background:var(--ink);color:#fff;border-radius:var(--r);padding:20px;text-align:center;margin:14px 0 0}
.codebox .k{font:700 11px/1 Inter;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-bottom:10px}
.codebox .btn{background:#fff;color:var(--ink)}
.codebox .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.pill.ok{background:#e3f4ea;color:var(--ok)} .pill.wait{background:#fff4dc;color:var(--warn)} .pill.no{background:#efece6;color:var(--mut)}
.credit{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.credit .v{font-size:36px;font-weight:800;letter-spacing:-.02em}
</style>
</head>
<body>
<header><div class="in"><a href="https://www.inkkulture.in" aria-label="Ink Kulture"><svg xmlns="http://www.w3.org/2000/svg" viewBox="56 56 3983 858" height="20" role="img" aria-label="Ink Kulture"><path fill="#0a0a0c" fill-rule="evenodd" d="M 4039 154 L 3772 153 L 3666 375 L 3546 609 L 3546 617 L 3834 615 L 3881 522 L 3725 522 L 3723 518 L 3762 441 L 3881 441 L 3926 360 L 3930 346 L 3813 344 L 3861 251 L 3991 251 Z M 3688 177 L 3674 162 L 3646 153 L 3403 153 L 3162 616 L 3291 617 L 3383 446 L 3379 617 L 3505 617 L 3505 442 L 3554 434 L 3589 413 L 3604 395 L 3693 224 L 3698 203 Z M 3544 255 L 3544 259 L 3541 261 L 3539 269 L 3536 271 L 3532 283 L 3529 285 L 3529 288 L 3522 297 L 3522 300 L 3520 301 L 3520 304 L 3515 311 L 3515 314 L 3513 315 L 3513 318 L 3510 321 L 3511 322 L 3508 325 L 3506 332 L 3501 337 L 3501 340 L 3498 343 L 3490 343 L 3487 346 L 3436 346 L 3434 344 L 3434 342 L 3437 339 L 3437 336 L 3439 335 L 3441 327 L 3444 325 L 3444 322 L 3448 319 L 3448 316 L 3451 313 L 3451 310 L 3453 309 L 3453 306 L 3455 305 L 3455 302 L 3458 299 L 3458 296 L 3460 295 L 3460 292 L 3463 289 L 3462 288 L 3465 285 L 3467 278 L 3472 274 L 3474 266 L 3477 264 L 3477 261 L 3479 260 L 3482 251 L 3486 251 L 3487 253 L 3509 253 L 3511 251 L 3540 251 Z M 3350 154 L 3222 153 L 3038 504 L 3010 520 L 2959 520 L 2955 515 L 3143 161 L 3143 153 L 3012 153 L 2807 549 L 2805 577 L 2817 603 L 2853 620 L 3070 617 L 3114 594 L 3138 568 Z M 2969 153 L 2659 154 L 2612 240 L 2610 250 L 2703 251 L 2704 255 L 2525 595 L 2518 617 L 2649 615 L 2838 251 L 2921 251 L 2969 163 Z M 2562 153 L 2429 153 L 2424 158 L 2415 182 L 2335 336 L 2335 342 L 2196 609 L 2196 617 L 2468 615 L 2515 528 L 2515 522 L 2378 522 L 2376 518 L 2562 161 Z M 2376 153 L 2246 153 L 2064 507 L 2044 520 L 1985 520 L 1983 511 L 2167 161 L 2167 153 L 2036 153 L 1841 536 L 1834 579 L 1843 600 L 1884 620 L 2096 617 L 2146 591 L 2167 565 Z M 988 153 L 771 617 L 907 617 L 992 439 L 1025 617 L 1233 617 L 1233 611 L 1170 558 L 1135 379 L 1371 171 L 1384 153 L 1228 153 L 1048 324 L 1045 320 L 1123 163 L 1123 153 Z M 933 154 L 800 153 L 699 367 L 674 158 L 669 153 L 534 153 L 324 598 L 320 617 L 453 617 L 555 401 L 588 617 L 711 617 Z M 1541 56 L 1575 116 L 1326 617 L 1480 617 L 1584 415 L 1613 593 L 2051 914 L 1767 539 L 1729 380 L 2092 57 L 1913 56 L 1643 296 L 1756 58 Z M 522 56 L 270 57 L 270 62 L 313 113 L 303 145 L 122 554 L 100 578 L 56 612 L 57 617 L 295 617 L 295 611 L 269 577 L 269 553 L 432 196 L 462 118 L 523 62 Z"/></svg></a><span class="grow"></span><span class="small mut">Refer and earn</span><button class="btn sm ghost hide" id="out">Log out</button></div></header>
<main class="wrap" id="app"><p class="mut" style="padding:40px 0">Loading…</p></main>
<footer>Ink Kulture · semi-permanent tattoos · <a href="https://www.inkkulture.in">inkkulture.in</a> · Creator? <a href="/creator">Creator program</a></footer>
<script>
(function(){
var TOK='ikr_tok', D=null;
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rs(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0})}
function tok(){try{return localStorage.getItem(TOK)||''}catch(e){return ''}}
function setTok(t){try{t?localStorage.setItem(TOK,t):localStorage.removeItem(TOK)}catch(e){}}
function api(p,b,auth){return fetch('/api/refer/'+p,{method:b?'POST':'GET',headers:Object.assign({'Content-Type':'application/json'},auth?{Authorization:'Bearer '+tok()}:{}),body:b?JSON.stringify(b):undefined}).then(function(r){return r.json()})}
function day(t){return new Date(t*1000).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
var app=$('#app');

function login(){
 var phone='';
 app.innerHTML='<section class="hero"><span class="eyebrow">Refer and earn</span><h1>Give ₹100.<br>Get ₹100.</h1><p class="lede">Your friends get ₹100 off their first Ink Kulture order. You get ₹100 store credit for every friend who pays online.</p></section>'
  +'<div class="card"><h2>See your code and credit</h2><p class="small mut" style="margin:0">Use the WhatsApp number you ordered with. We send a 4-digit code on WhatsApp.</p><label class="f">WhatsApp number<input id="l_p" inputmode="numeric" maxlength="10" placeholder="10-digit number" autocomplete="tel-national"></label><button class="btn full" style="margin-top:14px" id="l_go">Send code on WhatsApp</button><div id="l_otp" class="hide"><p class="small" style="margin:16px 0 0;text-align:center">Enter the code sent on WhatsApp</p><div class="otp"><input id="l_c" inputmode="numeric" autocomplete="one-time-code" maxlength="4" style="width:180px;letter-spacing:.4em"></div><button class="btn full" id="l_v">See my code</button></div><p class="err" id="l_err"></p></div>'
  +rulesCard({friend_off:100,you_get:100,days:60,cap:10});
 $('#l_go').onclick=function(){var b=$('#l_go');phone=$('#l_p').value.replace(/\D/g,'').slice(-10);b.disabled=true;$('#l_err').textContent='';
  api('otp',{phone:phone}).then(function(r){if(!r.ok){b.disabled=false;throw new Error(r.error||'Could not send')}b.textContent='Code sent · resend in 30 s';setTimeout(function(){b.disabled=false;b.textContent='Send again'},30000);$('#l_otp').classList.remove('hide');$('#l_c').focus()}).catch(function(e){$('#l_err').textContent=e.message})};
 function verify(){var c=$('#l_c').value.replace(/\D/g,'');if(c.length!==4)return;$('#l_v').disabled=true;
  api('verify',{phone:phone,code:c}).then(function(r){$('#l_v').disabled=false;if(!r.ok)throw new Error(r.error||'Wrong code');setTok(r.token);load()}).catch(function(e){$('#l_err').textContent=e.message})}
 $('#l_v').onclick=verify; $('#l_c').oninput=function(){if(this.value.replace(/\D/g,'').length===4)verify()};
}
function rulesCard(r){
 return '<div class="card"><h3>How it works</h3><ul class="rules small"><li>Your friend uses your code or link on inkkulture.in and gets <b>'+rs(r.friend_off)+' off</b> their <b>first order</b> when they pay online.</li><li>As soon as they pay, you get <b>'+rs(r.you_get)+' store credit</b>. It is valid for '+r.days+' days.</li><li>Your credit is applied automatically when you pay online on inkkulture.in with this WhatsApp number.</li><li>If your friend\'s order is cancelled or returned, that credit is taken back.</li><li>Up to '+r.cap+' friends a month. Your own code does not work on your own orders.</li></ul></div>';
}
function dash(){
 var d=D,r=d.rules;
 $('#out').classList.remove('hide');
 var share='Get ₹'+r.friend_off+' off your first Ink Kulture order (semi-permanent tattoos) with my code '+d.code+' 🖤 '+d.link;
 var h='<section class="hero" style="padding-top:24px"><span class="eyebrow">Refer and earn</span><h1 style="font-size:32px">Hi '+esc(d.name||'there')+' 👋</h1>'
  +'<div class="codebox"><div class="k">Your referral code</div><div class="big">'+esc(d.code)+'</div><div class="row"><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a><button class="btn sm" id="cpc">Copy code</button><button class="btn sm" id="cpl">Copy link</button></div></div></section>';
 h+='<div class="card"><div class="small mut">Your store credit</div><div class="credit"><div class="v">'+rs(d.credit)+'</div>'+(d.expires?'<div class="small mut">'+rs(d.expires.amount)+' of it is valid till '+esc(d.expires.on)+'</div>':'')+'</div>'
  +(d.credit>0?'<p class="small" style="margin:8px 0 0">Applied automatically when you pay online on inkkulture.in with this number.</p><a class="btn sm" style="margin-top:12px" href="https://www.inkkulture.in">Shop now</a>':'<p class="small mut" style="margin:8px 0 0">Share your code. You get '+rs(r.you_get)+' for every friend who pays online.</p>')+'</div>';
 h+='<div class="grid g3"><div class="stat"><div class="v">'+d.stats.friends+'</div><div class="l">Friends who ordered</div></div><div class="stat"><div class="v">'+d.stats.credited+'</div><div class="l">Credits you got</div></div><div class="stat"><div class="v">'+rs(d.stats.earned)+'</div><div class="l">Total credit earned</div></div></div>';
 h+='<div class="card"><h2>Friends\' orders</h2>'+(d.friends.length?'<table><tr><th>Order</th><th>Status</th></tr>'+d.friends.map(function(f){return '<tr><td><b>'+esc(f.order||'Order')+'</b><div class="small mut">'+day(f.date)+'</div></td><td><span class="pill '+f.tone+'">'+esc(f.status)+'</span></td></tr>'}).join('')+'</table>':'<p class="mut" style="margin:0">No friend orders yet. Share your code on WhatsApp, Instagram stories, or with your college group.</p>')+'</div>';
 if(d.credits.length)h+='<div class="card"><h2>Credit history</h2><table><tr><th>Added</th><th>Amount</th><th>Left</th><th>Valid till</th></tr>'+d.credits.map(function(c){return '<tr><td>'+day(c.added)+'</td><td>'+rs(c.amount)+'</td><td>'+(c.expired?'<span class="mut">expired</span>':rs(c.left))+'</td><td class="small">'+esc(c.expires)+'</td></tr>'}).join('')+'</table></div>';
 h+=rulesCard(r)+'<p class="small mut" style="text-align:center">Tip: send "code" to us on WhatsApp any time to get your code and credit there.</p>';
 app.innerHTML=h;
 function copy(t,b){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){var o=b.textContent;b.textContent='Copied ✓';setTimeout(function(){b.textContent=o},1500)}).catch(function(){prompt('Copy:',t)})}
 $('#cpc').onclick=function(){copy(d.code,this)}; $('#cpl').onclick=function(){copy(d.link,this)};
}
function load(){
 if(!tok()){$('#out').classList.add('hide');return login()}
 app.innerHTML='<p class="mut" style="padding:40px 0">Loading…</p>';
 api('me',null,true).then(function(r){if(!r.ok){setTok('');return login()}D=r;dash()}).catch(function(){app.innerHTML='<p class="err">Could not load. Check your internet and refresh.</p>'});
}
$('#out').onclick=function(){setTok('');D=null;load()};
load();
})();
</script>
</body>
</html>

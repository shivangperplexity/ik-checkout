@media(max-width:640px){.asb{max-width:100%}.tiles{grid-template-columns:1fr 1fr;gap:8px}.tile{padding:12px}.tile:first-child{grid-column:1/-1}.tile .big{font-size:22px}.tile .small.mut{font-size:11.5px}nav button{padding:10px 8px;font-size:13px}.asb .prop{padding:4px}.asb .prop td{padding:6px 4px}}

.msgs{background:#efeae2!important}.bub{box-shadow:0 1px .5px #0b141a22;border:0!important}.bub.in{background:#fff}.bub.tpl{background:#d9fdd3!important;font-size:14px}.bub.ai{background:#d9fdd3!important}
.bub .by{display:block;font-size:11px;font-weight:700;color:#027eb5;margin-bottom:2px}.bub.ai .by{color:#6b4fbb}.bub .m{text-align:right}.bub a{color:#027eb5;word-break:break-all}

<script>
(function(){
'use strict';
var TABS=[['home','Home'],['unshipped','To ship'],['ship','Shipments'],['orders','Orders'],['chats','Chats'],['more','More']];
var tab='home',token='',timer=null,S={filter:'all',days:7,msgTab:false,sel:{},rows:{},report:''},BULK=false;
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function inr(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0})}
function ago(t){if(!t)return '-';var d=Math.max(0,Math.floor(Date.now()/1000)-t);return d<60?d+'s ago':d<3600?Math.floor(d/60)+'m ago':d<86400?Math.floor(d/3600)+'h ago':Math.floor(d/86400)+'d ago'}
function ist(t){return t?new Date(t*1000).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'-'}
var tickAt=0;function tick(){if(Date.now()-tickAt<5*60*1000)return;tickAt=Date.now();rpc('tick').then(function(r){if(r.ran&&tab==='ship'&&!shSel().length)loadShip(true)}).catch(function(){})}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.add('hide')},Math.max(2600,String(m).length*70))}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null}
function rpc(action,data){
  /* marked packed on a device holding a Bluetooth printer: this device prints the labels (not the Mac queue) */
  var btp=action==='pack'&&data&&data.packed!==false&&btOn()&&IKBT.cfg().auto;
  if(btp)data=Object.assign({},data,{server_print:false});
  return fetch('/api/admin/rpc',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(Object.assign({action:action},data||{}))})
   .then(function(r){if(r.status===401){logout();throw new Error('Session expired')}return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||'Failed');
    if(btp&&j.results){var ids=j.results.filter(function(x){return x.ok}).map(function(x){return x.id});if(ids.length)btPrint(ids)}return j})}
/* ---- Bluetooth printer on this device (public/btprint.js) ---- */
function btOn(){return !!(window.IKBT&&IKBT.connected())}
var BTQ=Promise.resolve();
function btLabelPdf(id){return fetch('/api/admin/label',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id:id})}).then(function(r){
  if((r.headers.get('Content-Type')||'').indexOf('pdf')<0)return r.json().then(function(j){throw new Error(j.error||'no label')});return r.arrayBuffer()})
 .then(function(b){return (window.PDFLib?Promise.resolve():loadJs('/pdf-lib.min.js')).then(function(){return window.mergeLabels6x4?0:loadJs('/labels6x4.js')}).then(function(){return window.mergeLabels6x4([b])})})}
function btPrint(ids){ids=(ids||[]).filter(Boolean);
 ids.forEach(function(id){BTQ=BTQ.then(function(){var o=(S.rows&&S.rows[id])||(SH.rows&&SH.rows[id])||{};var nm=o.name||o.order_name||id;toast('Printing '+nm+' over Bluetooth…');
  return btLabelPdf(id).then(function(pdf){return IKBT.printPdf(pdf)}).then(function(){toast(nm+' printed')}).catch(function(e){toast(nm+': '+e.message)})})});
 return BTQ}
/* Print station: this device takes the labels queued from any device and prints them over Bluetooth (rpc print_station) */
var ST={t:null,run:false,done:null,last:'',wl:null};
function stationText(){return !IKBT.known()?'<b style="color:var(--warn)">Connect the printer above to start</b>':ST.last?esc(ST.last):'<b style="color:var(--ok)">Waiting for labels</b> · checks every 5 seconds'}
function stationShow(m){ST.last=m;var x=$('#bt_stx');if(x)x.innerHTML=stationText()}
function stationAwake(){try{if(navigator.wakeLock&&!ST.wl&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(function(l){ST.wl=l;l.addEventListener('release',function(){ST.wl=null})}).catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&window.IKBT&&IKBT.cfg().station){stationAwake();stationLoop()}});
function stationOff(){clearTimeout(ST.t);try{if(ST.wl)ST.wl.release()}catch(e){}var d=ST.done;ST.done=null;if(token)rpc('print_station',Object.assign({off:true},d||{})).catch(function(){})}
function stationLoop(){clearTimeout(ST.t);if(!window.IKBT||!IKBT.cfg().station||!token)return;
 if(ST.run){ST.t=setTimeout(stationLoop,3000);return}
 if(!IKBT.known()){IKBT.restore().then(function(ok){if(ok){btCard()}ST.t=setTimeout(stationLoop,ok?500:5000)});return}
 stationAwake();ST.run=true;var d=ST.done;ST.done=null;
 rpc('print_station',Object.assign({name:IKBT.name()},d||{})).then(function(r){
  if(!r.job)return 5000;
  var j=r.job;stationShow('Printing '+j.order+'…');toast('Printing '+j.order+' (sent from another device)…');
  var bin=atob(j.pdf),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return (BTQ=BTQ.then(function(){return IKBT.printPdf(u)})).then(function(){ST.done={done:j.id,ok:true};stationShow(j.order+' printed at '+new Date().toLocaleTimeString('en-IN'));return 500},
   function(e){stationShow(j.order+': '+e.message+' (tries again)');return 8000});
 }).catch(function(e){if(ST.done==null&&d)ST.done=d;stationShow('Not reaching the server: '+e.message);return 10000}).then(function(ms){ST.run=false;ST.t=setTimeout(stationLoop,ms)})}
/* ---- reviews (lib/reviews.js) ---- */
var RV={status:'',stars:0,q:''};
function starsTxt(n){n=Math.round(n||0);return '<span style="white-space:nowrap;letter-spacing:1px"><span style="color:#f5a623">'+'★★★★★'.slice(0,n)+'</span><span style="color:#d9d3c6">'+'★★★★★'.slice(0,5-n)+'</span></span>'}

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ink Kulture · Admin</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0c;--cream:#faf8f4;--line:#e6e1d6;--mut:#6b7280;--ok:#15803d;--bad:#b3261e;--warn:#b45309;--bg:#f4f1ea}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.login-card{width:100%;max-width:380px;display:grid;gap:12px}
.login-card img{height:34px;justify-self:start}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:#333}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=url],input[type=search],select,textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid #d8d3c6;border-radius:8px;background:#fff;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid #0a0a0c22;border-color:var(--ink)}
.btn{min-height:40px;padding:0 16px;border:1px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink)}.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px}.btn.bad{background:#fff;color:var(--bad);border-color:var(--bad)}.btn:disabled{opacity:.5}
.err{color:var(--bad);font-weight:600;font-size:13px}.ok{color:var(--ok);font-weight:600;font-size:13px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:1280px;margin:0 auto}
.bar img{height:26px}.grow{flex:1}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1280px;margin:0 auto;padding:0 10px}
nav button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--ink)}
nav .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--ok);color:#fff;font-size:11px;font-weight:800;text-align:center}
main{max-width:1280px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}.k4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi b{display:block;font-size:24px;font-weight:800;margin-top:2px}.kpi span{font-size:12px;color:var(--mut);font-weight:600}
h2{margin:0 0 10px;font-size:16px}h3{margin:0 0 8px;font-size:14px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid #efeadf;vertical-align:middle}tr.click{cursor:pointer}tr.click:hover{background:var(--cream)}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:#ede7dc}
.pill.low,.pill.ok{background:#e8f5ec;color:var(--ok)}.pill.medium,.pill.warn{background:#fff4e0;color:var(--warn)}.pill.high,.pill.bad{background:#fdecea;color:var(--bad)}
.mut{color:var(--mut)}.small{font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid #d8d3c6;background:#fff;border-radius:99px;padding:5px 12px;font-weight:600;cursor:pointer;font-size:13px}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.chip.tp:not(.on){border-color:var(--warn);color:var(--warn);font-weight:700}
.live{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.sess{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;display:grid;gap:6px}.sess.act{border-left:4px solid var(--ok)}.sess.old{opacity:.7}.sess.done{border-left:4px solid #6366f1}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:pu 1.4s infinite}@keyframes pu{50%{opacity:.25}}
.steps{display:flex;gap:3px}.steps i{height:5px;flex:1;border-radius:3px;background:#e6e1d6}.steps i.f{background:var(--ink)}
.bars .r{display:grid;grid-template-columns:170px 1fr 70px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.bars .t{height:16px;background:#efeadf;border-radius:5px;overflow:hidden}.bars .t u{display:block;height:100%;background:var(--ink);text-decoration:none}
.chatwrap{display:grid;grid-template-columns:290px minmax(0,1fr) 300px;gap:10px;height:calc(100vh - 150px);min-height:420px}
.chatlist,.chatmain,.chatside{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.chatlist .items{overflow-y:auto;flex:1}.chi{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:2px}.chi:hover{background:var(--cream)}.chi.on{background:#f1ede4}
.chi .t{display:flex;gap:6px;align-items:center}.chi .t b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chi .p{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.udot{width:9px;height:9px;border-radius:9px;background:var(--bad);flex:none}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--cream)}
.bub{max-width:78%;padding:8px 10px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;font-size:14px;line-height:1.35}
.bub .m{display:block;font-size:11px;color:var(--mut);margin-top:3px}.bub.in{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.bub.out{align-self:flex-end;background:#e7f6dd}.bub.ai{background:#e9eefc}.bub.tpl{background:#f3efe6;font-size:13px}.bub.bad{background:#fde8e6}
.sys{align-self:center;font-size:12px;color:var(--mut);background:#fff;border:1px dashed var(--line);border-radius:99px;padding:3px 10px;max-width:90%;text-align:center}
.compose{border-top:1px solid var(--line);padding:8px;display:grid;gap:6px}.compose textarea{width:100%;min-height:62px;resize:vertical;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;box-sizing:border-box}
.qr{display:flex;gap:6px;flex-wrap:wrap}.qr button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer}
.chatside{overflow-y:auto;padding:10px;gap:10px}.och{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:4px;font-size:13px}.och .its{display:flex;gap:6px;flex-wrap:wrap}.och .its img{width:44px;height:44px;object-fit:contain;background:var(--cream);border-radius:6px}
.chl{display:inline-grid;place-items:center;text-decoration:none}#ch_back{display:none}@media(max-width:760px){#ch_back{display:inline-block}}
.chhead{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:1100px){.chatwrap{grid-template-columns:260px minmax(0,1fr)}.chatside{grid-column:1/-1;max-height:none}}
@media(max-width:760px){.chatwrap{grid-template-columns:1fr;height:auto}.chatwrap.th .chatlist{display:none}.chatwrap:not(.th) .chatmain,.chatwrap:not(.th) .chatside{display:none}.msgs{min-height:55vh;max-height:65vh}.chatlist .items{max-height:70vh}}
.drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:#fff;z-index:50;box-shadow:-10px 0 40px #0004;overflow-y:auto;padding:18px}
.scrim{position:fixed;inset:0;background:#0006;z-index:40}
.vfy{position:fixed;inset:0;background:#0a0a0c;color:#fff;z-index:60;display:flex;flex-direction:column}.vfy video{width:100%;height:42vh;object-fit:cover;background:#000;display:block}.vfy .res{padding:14px 16px;font-size:17px;line-height:1.35;min-height:88px}.vfy .res.ok{background:#14532d}.vfy .res.bad{background:#7f1d1d}.vfy .res.warn{background:#92400e}.vfy .res.mut{background:#1f2937}.vfy .bar{display:flex;gap:8px;align-items:center;padding:10px 12px;flex-wrap:wrap}.vfy .bar .btn{background:#fff;color:#0a0a0c;border-color:#fff}.vfy .bar .btn.ghost{background:transparent;color:#fff;border-color:#fff8}.vfy input{background:#111;color:#fff;border:1px solid #444;border-radius:8px;padding:10px 12px;font-size:16px;flex:1;min-width:160px}.vfy .list{overflow:auto;flex:1;padding:0 12px 12px;font-size:14px}.vfy .list div{display:flex;gap:8px;padding:7px 4px;border-bottom:1px solid #222;align-items:center}.vfy .list .ok{color:#86efac}.vfy .list .no{color:#fca5a5}.vfy .list .exp{outline:2px solid #fff;border-radius:6px;padding:7px}
.gauge{height:10px;border-radius:99px;background:linear-gradient(90deg,#15803d,#f59e0b,#b3261e);position:relative}.gauge i{position:absolute;top:-4px;width:4px;height:18px;background:var(--ink);border-radius:2px}
.fac{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #e6e1d6;font-size:13px}.fac b.p{color:var(--bad)}.fac b.n{color:var(--ok)}
.sw{position:relative;width:42px;height:24px;display:inline-block;flex:none}.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:2}.sw span{position:absolute;inset:0;background:#cfc9ba;border-radius:99px;transition:.15s}.sw span:before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s}.sw input:checked+span{background:var(--ok)}.sw input:checked+span:before{left:21px}
.tpl{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.code{font-family:ui-monospace,monospace;font-size:12.5px;background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:6px 8px;word-break:break-all}
.up{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.up img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#eee}
.pkgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:12px 0}.pkc{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;position:relative;display:grid;gap:4px}.pkc img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--cream);border-radius:8px}.pkc .qty{position:absolute;top:12px;right:12px;background:var(--ink);color:#fff;font-weight:800;border-radius:99px;padding:3px 11px;font-size:15px}.pkc .qty.many{background:var(--warn)}.pkc b{font-size:13px;line-height:1.25}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:99;font-weight:600}
@media(max-width:640px){.bars .r{grid-template-columns:110px 1fr 56px}.hdrname{display:none}}
</style><script src="/btprint.js" defer></script></head><body>
<div id="login"><form class="card login-card" id="lf">
  <img src="https://www.inkkulture.in/cdn/shop/t/40/assets/ikl-logo-black.svg" alt="Ink Kulture" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'INK KULTURE'}))">
  <h2 style="margin:0">Admin sign in</h2>
  <label class="f">Email<input type="email" id="em" autocomplete="username" required></label>
  <label class="f">Password<input type="password" id="pw" autocomplete="current-password" required></label>
  <p class="err" id="le"></p><button class="btn" id="lb">Sign in</button>
</form></div>

<div id="app" class="hide">
<header><div class="bar"><img src="https://www.inkkulture.in/cdn/shop/t/40/assets/ikl-logo-black.svg" alt="Ink Kulture"><span class="hdrname mut small">Checkout admin</span><span class="grow"></span><span class="small mut" id="who"></span><button class="btn ghost sm" id="out">Sign out</button></div>
<nav id="nav"></nav></header>
<main id="main"></main></div>
<div id="ov"></div><div class="toast hide" id="toast"></div>

<script>
(function(){
'use strict';
var TABS=[['live','Live'],['unshipped','Unshipped'],['ship','Shipments'],['orders','Orders'],['chats','Chats'],['wa','WhatsApp'],['recovery','Abandoned'],['analytics','Analytics'],['upsell','Upsells'],['settings','Settings']];
var tab='live',token='',timer=null,S={filter:'all',days:7,msgTab:false,sel:{},rows:{},report:''},BULK=false;
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function inr(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0})}
function ago(t){if(!t)return '-';var d=Math.max(0,Math.floor(Date.now()/1000)-t);return d<60?d+'s ago':d<3600?Math.floor(d/60)+'m ago':d<86400?Math.floor(d/3600)+'h ago':Math.floor(d/86400)+'d ago'}
function ist(t){return t?new Date(t*1000).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'-'}
var tickAt=0;function tick(){if(Date.now()-tickAt<5*60*1000)return;tickAt=Date.now();rpc('tick').then(function(r){if(r.ran&&tab==='ship'&&!shSel().length)loadShip(true)}).catch(function(){})}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.add('hide')},Math.max(2600,String(m).length*70))}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null}
function rpc(action,data){
  /* marked packed on a device holding a Bluetooth printer: this device prints the labels (not the Mac queue) */
  var btp=action==='pack'&&data&&data.packed!==false&&btOn()&&IKBT.cfg().auto;
  if(btp)data=Object.assign({},data,{server_print:false});
  return fetch('/api/admin/rpc',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(Object.assign({action:action},data||{}))})
   .then(function(r){if(r.status===401){logout();throw new Error('Session expired')}return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||'Failed');
    if(btp&&j.results){var ids=j.results.filter(function(x){return x.ok}).map(function(x){return x.id});if(ids.length)btPrint(ids)}return j})}
/* ---- Bluetooth printer on this device (public/btprint.js) ---- */
function btOn(){return !!(window.IKBT&&IKBT.connected())}
var BTQ=Promise.resolve();
function btLabelPdf(id){return fetch('/api/admin/label',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id:id})}).then(function(r){
  if((r.headers.get('Content-Type')||'').indexOf('pdf')<0)return r.json().then(function(j){throw new Error(j.error||'no label')});return r.arrayBuffer()})
 .then(function(b){return (window.PDFLib?Promise.resolve():loadJs('/pdf-lib.min.js')).then(function(){return window.mergeLabels6x4?0:loadJs('/labels6x4.js')}).then(function(){return window.mergeLabels6x4([b])})})}
function btPrint(ids){ids=(ids||[]).filter(Boolean);
 ids.forEach(function(id){BTQ=BTQ.then(function(){var o=(S.rows&&S.rows[id])||(SH.rows&&SH.rows[id])||{};var nm=o.name||o.order_name||id;toast('Printing '+nm+' over Bluetooth…');
  return btLabelPdf(id).then(function(pdf){return IKBT.printPdf(pdf)}).then(function(){toast(nm+' printed')}).catch(function(e){toast(nm+': '+e.message)})})});
 return BTQ}
/* Print station: this device takes the labels queued from any device and prints them over Bluetooth (rpc print_station) */
var ST={t:null,run:false,done:null,last:'',wl:null};
function stationText(){return !IKBT.known()?'<b style="color:var(--warn)">Connect the printer above to start</b>':ST.last?esc(ST.last):'<b style="color:var(--ok)">Waiting for labels</b> · checks every 5 seconds'}
function stationShow(m){ST.last=m;var x=$('#bt_stx');if(x)x.innerHTML=stationText()}
function stationAwake(){try{if(navigator.wakeLock&&!ST.wl&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(function(l){ST.wl=l;l.addEventListener('release',function(){ST.wl=null})}).catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&window.IKBT&&IKBT.cfg().station){stationAwake();stationLoop()}});
function stationOff(){clearTimeout(ST.t);try{if(ST.wl)ST.wl.release()}catch(e){}var d=ST.done;ST.done=null;if(token)rpc('print_station',Object.assign({off:true},d||{})).catch(function(){})}
function stationLoop(){clearTimeout(ST.t);if(!window.IKBT||!IKBT.cfg().station||!token)return;
 if(ST.run){ST.t=setTimeout(stationLoop,3000);return}
 if(!IKBT.known()){IKBT.restore().then(function(ok){if(ok){btCard()}ST.t=setTimeout(stationLoop,ok?500:5000)});return}
 stationAwake();ST.run=true;var d=ST.done;ST.done=null;
 rpc('print_station',Object.assign({name:IKBT.name()},d||{})).then(function(r){
  if(!r.job)return 5000;
  var j=r.job;stationShow('Printing '+j.order+'…');toast('Printing '+j.order+' (sent from another device)…');
  var bin=atob(j.pdf),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return (BTQ=BTQ.then(function(){return IKBT.printPdf(u)})).then(function(){ST.done={done:j.id,ok:true};stationShow(j.order+' printed at '+new Date().toLocaleTimeString('en-IN'));return 500},
   function(e){stationShow(j.order+': '+e.message+' (tries again)');return 8000});
 }).catch(function(e){if(ST.done==null&&d)ST.done=d;stationShow('Not reaching the server: '+e.message);return 10000}).then(function(ms){ST.run=false;ST.t=setTimeout(stationLoop,ms)})}
function logout(){token='';ls('ik_admin_tok',null);clearInterval(timer);$('#app').classList.add('hide');$('#login').classList.remove('hide')}

/* ---- login ---- */
$('#lf').addEventListener('submit',function(e){e.preventDefault();$('#le').textContent='';$('#lb').disabled=true;
 fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value,password:$('#pw').value})}).then(function(r){return r.json()}).then(function(j){
  $('#lb').disabled=false;if(!j.ok){$('#le').textContent=j.error||'Sign in failed';return}
  token=j.token;ls('ik_admin_tok',token);ls('ik_admin_email',j.email);start()}).catch(function(){$('#lb').disabled=false;$('#le').textContent='Network error'})});
$('#out').onclick=logout;
function start(){$('#login').classList.add('hide');$('#app').classList.remove('hide');setTimeout(function(){if(window.IKBT&&IKBT.cfg().station)stationLoop()},1500);$('#who').textContent=ls('ik_admin_email')||'';
 $('#nav').innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'">'+t[1]+(t[0]==='live'?'<span class="dot" id="livedot">0</span>':t[0]==='chats'?'<span class="dot hide" id="chatdot" style="background:var(--bad)">0</span>':'')+'</button>'}).join('');
 $('#nav').onclick=function(e){var b=e.target.closest('button');if(b)go(b.dataset.t)};go(tab);setTimeout(tick,1500);setTimeout(chatCount,700);
 clearInterval(timer);timer=setInterval(function(){if(document.hidden)return;tick();if(tab==='live')loadLive(true);else if((tab==='orders'||tab==='unshipped')&&!$('#ov').innerHTML)loadOrders(true);else if(tab==='ship'&&!shSel().length&&!SH.report&&(SH.tick=(SH.tick||0)+1)%6===0)loadShip(true);else if(tab==='chats'&&!$('#ov').innerHTML&&(CH.tick=(CH.tick||0)+1)%2===0)loadChats(true);if((CH.ct=(CH.ct||0)+1)%6===1)chatCount()},5000);
 if(/^#chat=\d{10}$/.test(location.hash)){CH.phone=location.hash.slice(6);history.replaceState(null,'',location.pathname);go('chats')}}
function go(t){tab=t;[].forEach.call(document.querySelectorAll('#nav button'),function(b){b.classList.toggle('on',b.dataset.t===t)});
 $('#main').innerHTML='<p class="mut">Loading…</p>';if(t==='unshipped'){S.filter='unshipped';S.sel={}}else if(t==='orders'&&S.filter==='unshipped'){S.filter='all';S.sel={}}
 ({live:loadLive,chats:loadChats,orders:loadOrders,unshipped:loadOrders,recovery:loadRecovery,analytics:loadAnalytics,upsell:loadUpsell,ship:loadShip,wa:loadWa,settings:loadSettings})[t]()}
function fail(e){$('#main').innerHTML='<div class="card err">'+esc(e.message||e)+'</div>'}

/* ---- live ---- */
var STEPN={cart:'Browsing with cart',open:'Opened checkout',phone:'Entered phone',pin:'Entered PIN',address:'Filled address',pay:'Ready to pay',submit:'Tapped pay',done:'Ordered'};
var STEPI=['cart','open','phone','pin','address','pay','submit','done'];
function loadLive(quiet){rpc('live').then(function(j){
 $('#livedot').textContent=j.active;if(tab!=='live')return;
 var h='<div class="row" style="margin-bottom:10px"><span class="pulse"></span><b>'+j.active+' shopper'+(j.active===1?'':'s')+' with a cart right now</b><span class="mut small">updates every 5 seconds · last 30 minutes shown</span></div>';

 +(function(){var p=sh.pack||{};function f(id,l,k,st){return '<label class="f">'+l+'<input type="number" step="'+(st||'0.01')+'" id="pk_'+id+'" value="'+esc(String(p[k]==null?'':p[k]))+'"></label>'}
  return '<div class="grid two">'+f('al','Small envelope length (in)','a_l')+f('ab','Small envelope breadth (in)','a_b')+f('ca','Tattoos per small envelope','cap_a','1')+f('bl','Large envelope length (in)','b_l')+f('bb','Large envelope breadth (in)','b_b')+f('cb','Tattoos per large envelope','cap_b','1')+f('pad','Padding added (cm)','pad_cm')+f('bh','Base height (cm)','base_h_cm')+f('sh','Extra height per envelope (cm)','step_h_cm')+f('rl','Roll length (cm)','roll_l')+f('rb','Roll breadth (cm)','roll_b')+f('rh','Roll height (cm)','roll_h')+f('ew','Envelope weight (g)','env_weight_g')+f('tw','Tattoo weight if not set (g)','tattoo_weight_g')+'</div>'})()
 +'<h4 style="margin:10px 0 0">Parcel and rules</h4>'

 +'<div class="grid two"><label class="f">Choose<select id="sh_pol"><option value="cheapest"'+(sh.policy!=='fastest'?' selected':'')+'>Cheapest</option><option value="fastest"'+(sh.policy==='fastest'?' selected':'')+'>Fastest</option></select></label><label class="f">Cheapest may be slower by (days)<input id="sh_tol" type="number" min="0" max="10" value="'+esc(String(sh.tolerance_days==null?2:sh.tolerance_days))+'"></label></div>'
 +'<button class="btn" id="sh_sv">Save</button></div>'

 +'<label class="check" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rt_cod"> Cash on delivery</label>'
 +'<button class="btn" id="rt_go">Compare</button><div id="rt_out" class="small mut"></div></div>'

 $('#lg_sv').onclick=function(){var l={};[].forEach.call(document.querySelectorAll('.lg'),function(i){l[i.dataset.k]=i.value});rpc('save_logos',{logos:l}).then(function(){toast('Saved')}).catch(function(e){toast(e.message)})};

 $('#sh_sv').onclick=function(){var pk={};['al:a_l','ab:a_b','ca:cap_a','bl:b_l','bb:b_b','cb:cap_b','pad:pad_cm','bh:base_h_cm','sh:step_h_cm','rl:roll_l','rb:roll_b','rh:roll_h','ew:env_weight_g','tw:tattoo_weight_g'].forEach(function(m){var q=m.split(':');pk[q[1]]=$('#pk_'+q[0]).value});
  rpc('save_shipping',{shiprocket_email:$('#sh_sre').value,shiprocket_password:$('#sh_srp').value,shiprocket_couriers:$('#sh_scr').value,shiprocket_block:$('#sh_blk').value,sr_pickup:$('#sh_pk').value,sr_fallback_email:$('#sh_fe').value,pack:pk,origin_pin:$('#sh_pin').value,weight_g:$('#sh_wt').value,policy:$('#sh_pol').value,tolerance_days:$('#sh_tol').value}).then(function(){toast('Saved');loadSettings()}).catch(function(e){toast(e.message)})};
 $('#rt_go').onclick=function(){var o=$('#rt_out');o.textContent='Asking the carriers…';rpc('shipping_rates',{pin:$('#rt_pin').value,cod:$('#rt_cod').checked,amount:$('#rt_amt').value}).then(function(r){o.innerHTML=ratesTable(r)}).catch(function(e){o.textContent='Failed: '+e.message})};
 scopeCheck($('#st_scope'));printerCard();
 partialBind();
 metaLoad();
 convertLoad();
 $('#rk_go').onclick=function(){var b=$('#rk_go');b.disabled=true;b.textContent='Ranking…';rpc('rank_now').then(function(r){$('#rk_st').innerHTML=rankLine(r.status);toast(r.status.ok?'Product order updated':'Ranking failed')}).catch(function(e){toast(e.message)}).then(function(){b.disabled=false;b.textContent='Re-rank now'})};
 $('#pf_sv').onclick=function(){var b=$('#pf_sv');b.disabled=true;rpc('save_profit',{unit_cost:$('#pf_u').value,cac:$('#pf_c').value}).then(function(){toast('Saved')}).catch(function(er){toast(er.message)}).then(function(){b.disabled=false})};
 $('#pw_sv').onclick=function(){rpc('change_password',{current:$('#p0').value,next:$('#p1').value}).then(function(){toast('Password changed');$('#p0').value=$('#p1').value=''}).catch(function(e){toast(e.message)})}}).catch(fail)}

token=ls('ik_admin_tok')||'';if(token){rpc('live').then(start).catch(function(){})}

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ink Kulture · Admin</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0c;--cream:#faf8f4;--line:#e6e1d6;--mut:#6b7280;--ok:#15803d;--bad:#b3261e;--warn:#b45309;--bg:#f4f1ea}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.login-card{width:100%;max-width:380px;display:grid;gap:12px}
.login-card img{height:34px;justify-self:start}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:#333}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=url],input[type=search],select,textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid #d8d3c6;border-radius:8px;background:#fff;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid #0a0a0c22;border-color:var(--ink)}
.btn{min-height:40px;padding:0 16px;border:1px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink)}.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px}.btn.bad{background:#fff;color:var(--bad);border-color:var(--bad)}.btn:disabled{opacity:.5}
.err{color:var(--bad);font-weight:600;font-size:13px}.ok{color:var(--ok);font-weight:600;font-size:13px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:1280px;margin:0 auto}
.bar img{height:26px}.grow{flex:1}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1280px;margin:0 auto;padding:0 10px}
nav button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--ink)}
nav .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--ok);color:#fff;font-size:11px;font-weight:800;text-align:center}
main{max-width:1280px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}.k4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi b{display:block;font-size:24px;font-weight:800;margin-top:2px}.kpi span{font-size:12px;color:var(--mut);font-weight:600}
h2{margin:0 0 10px;font-size:16px}h3{margin:0 0 8px;font-size:14px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid #efeadf;vertical-align:middle}tr.click{cursor:pointer}tr.click:hover{background:var(--cream)}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:#ede7dc}
.pill.low,.pill.ok{background:#e8f5ec;color:var(--ok)}.pill.medium,.pill.warn{background:#fff4e0;color:var(--warn)}.pill.high,.pill.bad{background:#fdecea;color:var(--bad)}
.mut{color:var(--mut)}.small{font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid #d8d3c6;background:#fff;border-radius:99px;padding:5px 12px;font-weight:600;cursor:pointer;font-size:13px}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.chip.tp:not(.on){border-color:var(--warn);color:var(--warn);font-weight:700}
.live{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.sess{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;display:grid;gap:6px}.sess.act{border-left:4px solid var(--ok)}.sess.old{opacity:.7}.sess.done{border-left:4px solid #6366f1}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:pu 1.4s infinite}@keyframes pu{50%{opacity:.25}}
.steps{display:flex;gap:3px}.steps i{height:5px;flex:1;border-radius:3px;background:#e6e1d6}.steps i.f{background:var(--ink)}
.bars .r{display:grid;grid-template-columns:170px 1fr 70px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.bars .t{height:16px;background:#efeadf;border-radius:5px;overflow:hidden}.bars .t u{display:block;height:100%;background:var(--ink);text-decoration:none}
.drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:#fff;z-index:50;box-shadow:-10px 0 40px #0004;overflow-y:auto;padding:18px}
.scrim{position:fixed;inset:0;background:#0006;z-index:40}
.vfy{position:fixed;inset:0;background:#0a0a0c;color:#fff;z-index:60;display:flex;flex-direction:column}.vfy video{width:100%;height:42vh;object-fit:cover;background:#000;display:block}.vfy .res{padding:14px 16px;font-size:17px;line-height:1.35;min-height:88px}.vfy .res.ok{background:#14532d}.vfy .res.bad{background:#7f1d1d}.vfy .res.warn{background:#92400e}.vfy .res.mut{background:#1f2937}.vfy .bar{display:flex;gap:8px;align-items:center;padding:10px 12px;flex-wrap:wrap}.vfy .bar .btn{background:#fff;color:#0a0a0c;border-color:#fff}.vfy .bar .btn.ghost{background:transparent;color:#fff;border-color:#fff8}.vfy input{background:#111;color:#fff;border:1px solid #444;border-radius:8px;padding:10px 12px;font-size:16px;flex:1;min-width:160px}.vfy .list{overflow:auto;flex:1;padding:0 12px 12px;font-size:14px}.vfy .list div{display:flex;gap:8px;padding:7px 4px;border-bottom:1px solid #222;align-items:center}.vfy .list .ok{color:#86efac}.vfy .list .no{color:#fca5a5}.vfy .list .exp{outline:2px solid #fff;border-radius:6px;padding:7px}
.gauge{height:10px;border-radius:99px;background:linear-gradient(90deg,#15803d,#f59e0b,#b3261e);position:relative}.gauge i{position:absolute;top:-4px;width:4px;height:18px;background:var(--ink);border-radius:2px}
.fac{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #e6e1d6;font-size:13px}.fac b.p{color:var(--bad)}.fac b.n{color:var(--ok)}
.sw{position:relative;width:42px;height:24px;display:inline-block;flex:none}.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:2}.sw span{position:absolute;inset:0;background:#cfc9ba;border-radius:99px;transition:.15s}.sw span:before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s}.sw input:checked+span{background:var(--ok)}.sw input:checked+span:before{left:21px}
.tpl{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.code{font-family:ui-monospace,monospace;font-size:12.5px;background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:6px 8px;word-break:break-all}
.up{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.up img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#eee}
.pkgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:12px 0}.pkc{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;position:relative;display:grid;gap:4px}.pkc img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--cream);border-radius:8px}.pkc .qty{position:absolute;top:12px;right:12px;background:var(--ink);color:#fff;font-weight:800;border-radius:99px;padding:3px 11px;font-size:15px}.pkc .qty.many{background:var(--warn)}.pkc b{font-size:13px;line-height:1.25}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:99;font-weight:600}
@media(max-width:640px){.bars .r{grid-template-columns:110px 1fr 56px}.hdrname{display:none}}
</style></head><body>
<div id="login"><form class="card login-card" id="lf">
  <img src="https://www.inkkulture.in/cdn/shop/t/40/assets/ikl-logo-black.svg" alt="Ink Kulture" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'INK KULTURE'}))">
  <h2 style="margin:0">Admin sign in</h2>
  <label class="f">Email<input type="email" id="em" autocomplete="username" required></label>
  <label class="f">Password<input type="password" id="pw" autocomplete="current-password" required></label>
  <p class="err" id="le"></p><button class="btn" id="lb">Sign in</button>
</form></div>

<div id="app" class="hide">
<header><div class="bar"><img src="https://www.inkkulture.in/cdn/shop/t/40/assets/ikl-logo-black.svg" alt="Ink Kulture"><span class="hdrname mut small">Checkout admin</span><span class="grow"></span><span class="small mut" id="who"></span><button class="btn ghost sm" id="out">Sign out</button></div>
<nav id="nav"></nav></header>
<main id="main"></main></div>
<div id="ov"></div><div class="toast hide" id="toast"></div>

<script>
(function(){
'use strict';
var TABS=[['live','Live'],['unshipped','Unshipped'],['ship','Shipments'],['orders','Orders'],['wa','WhatsApp'],['recovery','Abandoned'],['analytics','Analytics'],['upsell','Upsells'],['settings','Settings']];
var tab='live',token='',timer=null,S={filter:'all',days:7,msgTab:false,sel:{},rows:{},report:''},BULK=false;
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function inr(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0})}
function ago(t){if(!t)return '-';var d=Math.max(0,Math.floor(Date.now()/1000)-t);return d<60?d+'s ago':d<3600?Math.floor(d/60)+'m ago':d<86400?Math.floor(d/3600)+'h ago':Math.floor(d/86400)+'d ago'}
function ist(t){return t?new Date(t*1000).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'-'}
var tickAt=0;function tick(){if(Date.now()-tickAt<5*60*1000)return;tickAt=Date.now();rpc('tick').then(function(r){if(r.ran&&tab==='ship'&&!shSel().length)loadShip(true)}).catch(function(){})}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.add('hide')},Math.max(2600,String(m).length*70))}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null}
function rpc(action,data){
  return fetch('/api/admin/rpc',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(Object.assign({action:action},data||{}))})
   .then(function(r){if(r.status===401){logout();throw new Error('Session expired')}return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||'Failed');return j})}
function logout(){token='';ls('ik_admin_tok',null);clearInterval(timer);$('#app').classList.add('hide');$('#login').classList.remove('hide')}

/* ---- login ---- */
$('#lf').addEventListener('submit',function(e){e.preventDefault();$('#le').textContent='';$('#lb').disabled=true;
 fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value,password:$('#pw').value})}).then(function(r){return r.json()}).then(function(j){
  $('#lb').disabled=false;if(!j.ok){$('#le').textContent=j.error||'Sign in failed';return}
  token=j.token;ls('ik_admin_tok',token);ls('ik_admin_email',j.email);start()}).catch(function(){$('#lb').disabled=false;$('#le').textContent='Network error'})});
$('#out').onclick=logout;
function start(){$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=ls('ik_admin_email')||'';
 $('#nav').innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'">'+t[1]+(t[0]==='live'?'<span class="dot" id="livedot">0</span>':'')+'</button>'}).join('');
 $('#nav').onclick=function(e){var b=e.target.closest('button');if(b)go(b.dataset.t)};go(tab);setTimeout(tick,1500);
 clearInterval(timer);timer=setInterval(function(){if(document.hidden)return;tick();if(tab==='live')loadLive(true);else if((tab==='orders'||tab==='unshipped')&&!$('#ov').innerHTML)loadOrders(true);else if(tab==='ship'&&!shSel().length&&!SH.report&&(SH.tick=(SH.tick||0)+1)%6===0)loadShip(true)},5000)}
function go(t){tab=t;[].forEach.call(document.querySelectorAll('#nav button'),function(b){b.classList.toggle('on',b.dataset.t===t)});
 $('#main').innerHTML='<p class="mut">Loading…</p>';if(t==='unshipped'){S.filter='unshipped';S.sel={}}else if(t==='orders'&&S.filter==='unshipped'){S.filter='all';S.sel={}}
 ({live:loadLive,orders:loadOrders,unshipped:loadOrders,recovery:loadRecovery,analytics:loadAnalytics,upsell:loadUpsell,ship:loadShip,wa:loadWa,settings:loadSettings})[t]()}
function fail(e){$('#main').innerHTML='<div class="card err">'+esc(e.message||e)+'</div>'}

/* ---- live ---- */
var STEPN={cart:'Browsing with cart',open:'Opened checkout',phone:'Entered phone',pin:'Entered PIN',address:'Filled address',pay:'Ready to pay',submit:'Tapped pay',done:'Ordered'};
var STEPI=['cart','open','phone','pin','address','pay','submit','done'];
function loadLive(quiet){rpc('live').then(function(j){
 $('#livedot').textContent=j.active;if(tab!=='live')return;
 var h='<div class="row" style="margin-bottom:10px"><span class="pulse"></span><b>'+j.active+' shopper'+(j.active===1?'':'s')+' with a cart right now</b><span class="mut small">updates every 5 seconds · last 30 minutes shown</span></div>';
 h+='<div class="live">'+(j.sessions.length?j.sessions.map(function(s){
  var cls=s.ordered?'done':s.active?'act':'old',idx=STEPI.indexOf(s.step);
  return '<div class="sess '+cls+'"><div class="row"><b>'+esc(s.name||(s.phone?'+91 '+s.phone:'Visitor '+s.sid))+'</b><span class="grow"></span>'+(s.ordered?'<span class="pill ok">Ordered '+esc(s.order||'')+'</span>':s.active?'<span class="pill ok"><span class="pulse"></span> live</span>':'<span class="mut small">'+ago(s.last_seen)+'</span>')+'</div>'
  +'<div class="steps">'+STEPI.map(function(_,i){return '<i class="'+(i<=Math.max(idx,s.max_step)?'f':'')+'"></i>'}).join('')+'</div>'
  +'<div class="small"><b>'+esc(STEPN[s.step]||s.step)+'</b> · '+esc(s.device||'')+' · '+esc(s.source)+(s.method?' · '+esc(s.method):'')+'</div>'
  +'<div class="small mut">'+s.cart.map(function(c){return esc(c.t)+' ×'+c.q}).join(', ')+'</div><div class="row"><b>'+inr(s.value/100)+'</b>'+(s.phone?'<span class="grow"></span><a class="small" target="_blank" rel="noopener" href="https://wa.me/91'+s.phone+'">Chat</a>':'')+'</div>'
  +(s.phone&&!s.ordered?'<div class="row" style="margin-top:6px"><button class="btn sm" data-ln="'+esc(s.phone)+'"'+(NUDGING[s.phone]?' disabled':'')+'>'+(NUDGING[s.phone]?'Sending…':s.nudged_at?'Nudge again':'Nudge on WhatsApp')+'</button>'+(s.nudged_at?'<span class="small mut">nudged '+ago(s.nudged_at)+'</span>':'')+'</div>':'')+'</div>'}).join(''):'<p class="mut">No recent activity. Open the store in another tab and add something to the cart to see it here.</p>')+'</div>';
 $('#main').innerHTML=h;
 $('#main').onclick=function(e){var b=e.target.closest('[data-ln]');if(!b)return;var ph=b.dataset.ln;NUDGING[ph]=1;b.disabled=true;b.textContent='Sending…';
  rpc('nudge',{phone:ph}).then(function(r){toast('Nudge sent on WhatsApp ('+r.template+')')}).catch(function(x){toast(x.message)}).then(function(){delete NUDGING[ph];loadLive(true)})}}).catch(function(e){if(!quiet)fail(e)})}
var NUDGING={};

/* ---- orders ---- */
var FIL=[['all','All'],['shipped','Shipped'],['packed','Packed'],['high','High risk']];
function loadOrders(quiet){if(BULK)return;var UN=tab==='unshipped';if(UN)S.filter='unshipped';rpc('orders',{filter:S.filter,q:S.q||'',fresh:quiet?0:1}).then(function(j){if((tab!=='orders'&&tab!=='unshipped')||BULK)return;
 S.rows={};j.orders.forEach(function(o){S.rows[o.id]=o});var nb=j.orders.filter(function(o){return o.booked}).length;
 var keep=quiet&&$('#q')?$('#q').value:S.q||'';
 var h=(UN?'':'<div class="chips">'+FIL.map(function(f){return '<button class="chip'+(S.filter===f[0]?' on':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>'}).join('')+'</div>')+'<div class="row" style="margin-bottom:10px"><input type="search" id="q" placeholder="Search order, phone, name, PIN" value="'+esc(keep)+'" style="max-width:320px">'+(S.filter==='shipped'&&nb?'<button class="btn sm" id="lbl_all">Download all labels (6×4 in) · '+nb+'</button>':'')+(function(){if(S.filter!=='toship'&&!UN)return '';var n=j.orders.filter(function(o){return ready(o)&&!o.packed_at}).length;return n?'<button class="btn sm" id="pack_all">Start packing · '+n+'</button>':''})()+'</div>'+(S.report||'')+'<div class="row hide" id="bulkbar" style="position:sticky;top:100px;z-index:15;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px"></div>';
 var P=j.profit;
 if(P&&P.n){var net=P.net;h+='<div class="card" style="margin-bottom:10px"><div class="row" style="gap:18px"><span><span class="small mut">Expected profit</span><br><b style="font-size:22px;color:'+(net>=0?'var(--ok)':'var(--bad)')+'">'+inr(net)+'</b> <span class="small mut">avg '+inr(P.avg)+' / order</span></span>'
  +'<span><span class="small mut">Revenue</span><br><b>'+inr(P.revenue)+'</b> <span class="small mut">'+P.n+' orders</span></span>'
  +'<span><span class="small mut">Product cost</span><br><b>'+inr(P.product)+'</b> <span class="small mut">'+P.units+' items × ₹'+P.unit_cost+'</span></span>'
  +'<span><span class="small mut">CAC</span><br><b>'+inr(P.cac)+'</b> <span class="small mut">'+P.n+' × ₹'+P.cac_per_order+'</span></span>'
  +'<span><span class="small mut">Shipping</span><br><b>'+inr(P.shipping)+'</b> <span class="small mut">Shiprocket charges</span></span></div>'
  +'<p class="small mut" style="margin:8px 0 0">Profit = total − product cost − CAC − courier charge, counting every order as delivered (an RTO loses the courier charge and the CAC).'+(P.unknown?' <b>'+P.unknown+'</b> order'+(P.unknown===1?'':'s')+' shipped outside Shiprocket '+(P.unknown===1?'uses':'use')+' an estimated courier charge of ₹'+P.ship_estimate+' (marked est.).':'')+' Change the ₹'+P.unit_cost+' / ₹'+P.cac_per_order+' assumptions in Settings.</p></div>'}
 var PC=S.filter==='shipped';
 function rowOf(o){var can=!o.shipped&&o.status!=='cancelled';
  var st=o.shipped_at?'<span class="pill ok">Shipped</span>':o.booked?'<span class="pill warn" title="Booked with '+esc(o.courier)+', AWB '+esc(o.awb)+'. Shopify is not fulfilled yet'+(o.fulfil_error?': '+esc(o.fulfil_error):'. It is retried automatically.')+'">Booked · Shopify pending</span>':o.status==='cancelled'?'<span class="pill bad">Cancelled</span>':(o.packed_at?'<span class="pill ok" title="Packed '+ist(o.packed_at)+'">Packed</span> ':'')+(o.method==='cod'&&!o.confirmed_at?'<span class="pill warn">COD unconfirmed</span>':o.packed_at?'':'<span class="pill">Ready to ship</span>');
  var pf=o.profit?'<b style="color:'+(o.profit.net>=0?'var(--ok)':'var(--bad)')+'" title="'+inr(o.total)+' − '+o.profit.units+' × ₹'+(o.profit.product/o.profit.units)+' product − ₹'+o.profit.cac+' CAC − '+inr(o.profit.shipping)+' courier'+(o.profit.est?' (estimated: shipped outside Shiprocket)':'')+'">'+inr(o.profit.net)+(o.profit.est?'<span class="mut" style="font-weight:400"> est.</span>':'')+'</b>':'';
  return '<tr class="click" data-id="'+o.id+'"><td class="ck"><input type="checkbox" class="sel" data-id="'+o.id+'"'+(can?'':' disabled')+(can&&S.sel[o.id]?' checked':'')+'></td><td><b>'+esc(o.name)+'</b></td><td>'+esc(o.customer)+'<div class="small mut">+91 '+esc(o.phone)+'</div></td><td>'+esc(o.city)+'<div class="small mut">'+esc(o.pincode)+'</div></td><td>'+(o.method==='cod'?'COD':'Prepaid')+'</td><td>'+inr(o.total)+'</td>'+(PC?'<td>'+pf+'</td>':'')+'<td>'+st+'</td><td><span class="pill '+o.level+'">'+o.risk+' · '+o.level+'</span></td><td class="small mut">'+ago(o.created_at)+'</td></tr>'}

 if(UN){var rd=j.orders.filter(function(o){return o.ready}),uc=j.orders.filter(function(o){return !o.ready});

  var reader=new ZXing.MultiFormatReader();reader.setHints(hints);
  function decode(lum,w,h,x0,x1){var cw=x1-x0,sub=new Uint8ClampedArray(cw*h);for(var y=0;y<h;y++)sub.set(lum.subarray(y*w+x0,y*w+x1),y*cw);
   try{reader.reset();return reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.RGBLuminanceSource(sub,cw,h)))).getText()}catch(e){return ''}}
  function frame(){if(!V.on)return;
   if(video.readyState>=2&&video.videoWidth){var vw=video.videoWidth,vh=video.videoHeight,bh=Math.round(vh*.3),by=Math.round((vh-bh)/2);
    if(cv.width!==vw||cv.height!==bh){cv.width=vw;cv.height=bh}
    ctx.drawImage(video,0,by,vw,bh,0,0,vw,bh);var d=ctx.getImageData(0,0,vw,bh).data,lum=new Uint8ClampedArray(vw*bh);
    for(var i=0,j=0;i<lum.length;i++,j+=4)lum[i]=(d[j]*299+d[j+1]*587+d[j+2]*114)/1000;
    var txt='',cuts=[[0,1],[.4,1],[0,.6],[.2,.8]];
    for(var c=0;c<cuts.length&&!txt;c++)txt=decode(lum,vw,bh,Math.round(vw*cuts[c][0]),Math.round(vw*cuts[c][1]));
    if(txt)check(txt,true)}
   setTimeout(frame,V.busy?250:90)}
  return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}}).then(function(stream){V.stream=stream;video.srcObject=stream;return video.play()}).then(function(){
   try{var tr=V.stream.getVideoTracks()[0],caps=tr.getCapabilities?tr.getCapabilities():{};if(caps.focusMode&&caps.focusMode.indexOf('continuous')>=0)tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(function(){})}catch(e){}

/* Cancel every Shiprocket booking still waiting for pickup. Orders are NOT cancelled: they go back to "To ship" and can be booked again. */
function cancelAllPending(btn){var n=+(btn.textContent.match(/\d+/)||[0])[0];
 if(!confirm('Cancel ALL '+n+' pending pickups in Shiprocket?\n\nOnly parcels the courier has not collected are cancelled. The orders are NOT cancelled: they go back to "To ship" in the Orders tab, where you can book them again (new AWB).'))return;
 btn.disabled=true;var t0=btn.textContent;var res=[],i=0,ids=[];
 function fin(){var ok=shReport('Cancel pending pickups',res);btn.disabled=false;btn.textContent=t0;toast(ok+' of '+res.length+' cancelled');SH.sel={};loadShip()}
 function step(){if(i>=ids.length)return fin();var chunk=ids.slice(i,i+4);i+=chunk.length;btn.textContent='Cancelling '+Math.min(i,ids.length)+' of '+ids.length+'…';
  rpc('ship_cancel',{ids:chunk}).then(function(r){res=res.concat(r.results)}).catch(function(er){chunk.forEach(function(id){res.push({id:id,name:(SH.rows[id]||{}).order_name||id,ok:false,note:er.message})})}).then(step)}
 rpc('ship_pending_ids').then(function(r){ids=r.ids||[];if(!ids.length){btn.disabled=false;btn.textContent=t0;toast('Nothing waiting for pickup');return}step()}).catch(function(er){btn.disabled=false;btn.textContent=t0;toast(er.message)})}
function shBar(){var b=$('#sh_bar');if(!b)return;var ids=shSel();b.classList.toggle('hide',!ids.length);
 var st=ids.map(function(k){return SH.rows[k].stage}),pk=st.filter(function(s){return s==='pickup_pending'||s==='pickup_failed'}).length;
 var up=ids.filter(function(k){var x=SH.rows[k];return (x.stage==='pickup_pending'||x.stage==='pickup_failed')&&!x.packed_at}).length;
 b.innerHTML='<b>'+ids.length+' selected</b>'+(up?'<button class="btn sm" data-act="pack">Start packing · '+up+'</button><button class="btn ghost sm" data-act="mark">Mark packed · '+up+'</button>':'')+'<button class="btn '+(up?'ghost ':'')+'sm" data-act="labels">Labels (6×4 in)</button>'
  +(pk?'<button class="btn ghost sm" data-act="pickup">Request pickup · '+pk+'</button><button class="btn ghost sm" data-act="pickup_date">Pickup on a date…</button>':'')
  +'<button class="btn ghost sm" data-act="manifest">Manifest</button><button class="btn ghost sm" data-act="refresh">Refresh status</button>'

 var a=$('#sh_all');if(a){var lv=Object.keys(SH.rows).filter(function(k){return SH.rows[k].stage!=='cancelled'});a.checked=lv.length>0&&lv.every(function(k){return SH.sel[k]})}}
function shRefresh(btn,ids){if(!ids.length)return;var t=btn.textContent;btn.disabled=true;btn.textContent='Checking with Shiprocket…';
 rpc('ship_refresh',{ids:ids.slice(0,80)}).then(function(r){toast('Updated '+r.refreshed+' shipment'+(r.refreshed===1?'':'s'));loadShip()}).catch(function(er){toast(er.message)}).then(function(){btn.disabled=false;btn.textContent=t})}
function shReport(title,res){var ok=res.filter(function(r){return r.ok}).length;
 SH.report='<div class="card" style="margin-bottom:10px"><div class="row"><b>'+esc(title)+': '+ok+' of '+res.length+' done</b><span class="grow"></span><button class="btn ghost sm" id="rep_xs">Dismiss</button></div>'
  +res.map(function(r){return '<div class="small'+(r.ok?'':' err')+'" style="margin-top:4px"><b>'+esc(r.name||r.id)+'</b> · '+esc(r.note||'')+'</div>'}).join('')+'</div>';
 return ok}
function shAct(act,btn){var ids=shSel();if(!ids.length)return;
 var pend=ids.filter(function(k){var s=SH.rows[k].stage;return s==='pickup_pending'||s==='pickup_failed'});
 if(act==='clear'){SH.sel={};loadShip();return}
 var unp=pend.filter(function(k){return !SH.rows[k].packed_at});
 if(act==='pack'){packMode(unp.sort(function(a,b){return SH.rows[a].booked_at-SH.rows[b].booked_at}));return}
 if(act==='mark'){btn.disabled=true;rpc('pack',{ids:unp,packed:true}).then(function(r){var ok=shReport('Mark packed',r.results);toast(ok+' marked packed');loadShip()}).catch(function(er){btn.disabled=false;toast(er.message)});return}
 if(act==='cancel_order'){if(!confirm('Cancel '+pend.length+' ORDER'+(pend.length>1?'S':'')+'? For each: the Shiprocket pickup is cancelled (only possible before the courier collects it), then the Shopify order is cancelled and stock restocked. No refund is issued from here.'))return;
  btn.disabled=true;btn.textContent='Cancelling…';
  rpc('cancel_orders',{ids:pend}).then(function(r){var ok=shReport('Cancel order',r.results);toast(ok+' order'+(ok===1?'':'s')+' cancelled');SH.sel={};loadShip()}).catch(function(er){btn.disabled=false;toast(er.message)});return}
 if(act==='labels'){dlLabels(ids,btn);return}
 if(act==='refresh'){shRefresh(btn,ids);return}
 if(act==='manifest'){btn.disabled=true;rpc('ship_manifest',{ids:ids}).then(function(r){window.open(r.url,'_blank','noopener');toast('Manifest ready')}).catch(function(er){toast(er.message)}).then(function(){btn.disabled=false});return}
 if(act==='pickup'||act==='pickup_date'){var d='';
  if(act==='pickup_date'){d=prompt('Pickup on which date? Format 2026-10-20','');if(d===null)return;d=d.trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){toast('Date must look like 2026-10-20');return}}
  btn.disabled=true;btn.textContent='Requesting…';
  rpc('ship_pickup',{ids:pend,date:d}).then(function(r){var ok=shReport('Pickup request',r.results);toast(ok+' pickup request'+(ok===1?'':'s')+' sent');SH.sel={};loadShip()}).catch(function(er){btn.disabled=false;toast(er.message)});return}
 if(act==='cancel'){if(!confirm('Cancel '+pend.length+' shipment'+(pend.length>1?'s':'')+' in Shiprocket? Only parcels the courier has not picked up are cancelled. The orders are NOT cancelled: they go back to "To ship".'))return;
  btn.disabled=true;btn.textContent='Cancelling…';
  rpc('ship_cancel',{ids:pend}).then(function(r){var ok=shReport('Cancel shipment',r.results);toast(ok+' cancelled');SH.sel={};loadShip()}).catch(function(er){btn.disabled=false;toast(er.message)});return}}

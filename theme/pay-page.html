<!-- Ink Kulture pay-online page: Shopify page "pay" (inkkulture.in/pages/pay?k=<orderId>-<sig>). Source: ik-checkout/theme/pay-page.html.
     All data comes from https://ik-checkout.vercel.app/api/convert (lib/wa-convert.js); nothing is stored in Shopify. -->
<div id="ikpay" data-api="https://ik-checkout.vercel.app"><p style="text-align:center;opacity:.6;padding:40px 0">Loading your order…</p></div>
<style>
#ikpay{--ink:#0a0a0c;--mut:#6b6b70;--line:#e6e1d6;--ok:#15803d;max-width:440px;margin:0 auto 40px;padding:0 16px;font-family:inherit;color:var(--ink)}
#ikpay *{box-sizing:border-box}
#ikpay .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 24px rgba(0,0,0,.05)}
#ikpay h2{font-size:22px;margin:0 0 4px;line-height:1.25}
#ikpay .mut{color:var(--mut);font-size:14px;margin:0}
#ikpay .its{display:grid;gap:10px;margin:14px 0}
#ikpay .it{display:flex;gap:12px;align-items:center}
#ikpay .it img{width:56px;height:56px;object-fit:contain;background:#faf8f4;border-radius:10px;border:1px solid var(--line)}
#ikpay .it b{font-size:14px;display:block;line-height:1.3}
#ikpay .it span{font-size:12px;color:var(--mut)}
#ikpay .rows{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;display:grid;gap:6px;font-size:15px}
#ikpay .row{display:flex;justify-content:space-between;gap:10px}
#ikpay .save{color:var(--ok);font-weight:700}
#ikpay .tot{font-size:20px;font-weight:800}
#ikpay .strike{text-decoration:line-through;color:var(--mut)}
#ikpay .badge{display:inline-block;background:#0a0a0c;color:#fff;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.02em}
#ikpay .apps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
#ikpay button,#ikpay .btn{font:inherit;font-weight:700;font-size:15px;border-radius:14px;padding:14px 12px;cursor:pointer;width:100%;border:1px solid var(--ink);background:#fff;color:var(--ink);text-align:center;text-decoration:none;display:block}
#ikpay button.y{background:var(--ink);color:#fff}
#ikpay button[disabled]{opacity:.55;cursor:default}
#ikpay .full{grid-column:1/-1}
#ikpay .note{font-size:12px;color:var(--mut);text-align:center;margin:12px 0 0}
#ikpay .err{color:#b3261e;font-size:14px;margin:10px 0 0;text-align:center}
#ikpay .big{font-size:44px;text-align:center;margin:6px 0}
#ikpay .spin{width:34px;height:34px;border:3px solid #ddd;border-top-color:var(--ink);border-radius:50%;margin:10px auto;animation:ikspin 1s linear infinite}
@keyframes ikspin{to{transform:rotate(360deg)}}
</style>
<script>
(function () {
  var box = document.getElementById('ikpay'); if (!box) return;
  var API = box.getAttribute('data-api'), qs = new URLSearchParams(location.search), K = qs.get('k') || '', R = qs.get('r') || '';
  var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var SCHEME = { gpay: 'tez://upi/pay?', phonepe: 'phonepe://pay?', paytm: 'paytmmp://pay?' };
  var APPS = [['gpay', 'Google Pay'], ['phonepe', 'PhonePe'], ['paytm', 'Paytm'], ['any', 'Other UPI app']];
  var D = null, txn = '', poll = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function inr(p) { var r = Math.round(p) / 100; return '₹' + (r % 1 ? r.toFixed(2) : r.toLocaleString('en-IN')); }
  function img(u) { return u ? u + (u.indexOf('?') > -1 ? '&' : '?') + 'width=120' : ''; }
  function api(body) { return fetch(API + '/api/convert', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
  function show(h) { box.innerHTML = h; }
  function msg(title, text, icon) { show('<div class="card" style="text-align:center">' + (icon ? '<div class="big">' + icon + '</div>' : '') + '<h2>' + title + '</h2><p class="mut" style="margin-top:8px">' + text + '</p><p style="margin-top:16px"><a class="btn" href="/">Continue shopping</a></p></div>'); }
  function left(t) { var s = Math.max(0, t - Math.floor(Date.now() / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? h + 'h ' + m + 'm' : m + ' min'; }
  function states(d) {
    var o = esc(d.order || '');
    if (d.state === 'paid') return msg('Payment received', 'Thank you' + (d.name ? ', ' + esc(d.name) : '') + '! Order ' + o + ' is now prepaid. We pack and ship prepaid orders first.', '✅'), true;
    if (d.state === 'booked') return msg('Already on its way', 'Order ' + o + ' is already packed and handed to the courier, so it stays Cash on Delivery. Thank you!', '📦'), true;
    if (d.state === 'expired') return msg('This offer has ended', 'Order ' + o + ' stays Cash on Delivery and ships as planned.', '⏰'), true;
    if (d.state === 'cancelled') return msg('Order cancelled', 'Order ' + o + ' was cancelled.', ''), true;
    if (d.state === 'not_cod') return msg('Nothing to pay', 'Order ' + o + ' does not need an online payment.', ''), true;
    if (d.state === 'invalid' || d.state === 'missing') return msg('Link not valid', 'Please open the link from your WhatsApp message again.', ''), true;
    if (!d.ok) return msg('Something went wrong', esc(d.error || 'Please try again in a minute.'), ''), true;
    return false;
  }
  function draw(d) {
    if (states(d)) return;
    D = d;
    var items = (d.items || []).map(function (i) { return '<div class="it">' + (i.image ? '<img src="' + esc(img(i.image)) + '" alt="">' : '') + '<div><b>' + esc(i.title) + (i.qty > 1 ? ' × ' + i.qty : '') + '</b><span>' + esc(i.size || '') + (i.free ? (i.size ? ' · ' : '') + 'FREE (Buy 1 Get 1)' : '') + '</span></div></div>'; }).join('');
    var h = '<div class="card"><span class="badge">' + d.pct + '% OFF · PAY ONLINE</span><h2 style="margin-top:12px">Order ' + esc(d.order) + '</h2><p class="mut">Hi' + (d.name ? ' ' + esc(d.name) : '') + '! Pay online now and save on your Cash on Delivery order.' + (d.expires_at ? ' Offer ends in <b>' + left(d.expires_at) + '</b>.' : '') + '</p>'
      + '<div class="its">' + items + '</div><div class="rows"><div class="row"><span>Cash on delivery</span><span class="strike">' + inr(d.total) + '</span></div><div class="row save"><span>Prepaid ' + d.pct + '% off</span><span>− ' + inr(d.discount) + '</span></div><div class="row tot"><span>Pay now</span><span>' + inr(d.payable) + '</span></div></div>';
    if (mobile) h += '<div class="apps">' + APPS.map(function (a) { return '<button type="button" class="' + (a[0] === 'gpay' ? 'y' : '') + '" data-app="' + a[0] + '">' + a[1] + '</button>'; }).join('') + '<button type="button" class="full" data-app="web">Card / Netbanking / UPI ID</button></div>';
    else h += '<div class="apps"><button type="button" class="y full" data-app="web">Pay ' + inr(d.payable) + '</button></div>';
    h += '<p class="note">🔒 Secured by PayU · Prepaid orders are packed and shipped first</p><div id="ikerr"></div></div>';
    show(h);
    box.onclick = function (e) { var b = e.target.closest('[data-app]'); if (b) start(b.getAttribute('data-app'), b); };
  }
  function err(t) { var e = document.getElementById('ikerr'); if (e) e.innerHTML = '<p class="err">' + esc(t) + '</p>'; }
  function start(app, btn) {
    [].forEach.call(box.querySelectorAll('[data-app]'), function (x) { x.disabled = true; });
    btn.textContent = 'Opening…';
    api({ k: K, op: 'start', upi: app !== 'web' }).then(function (r) {
      if (states(r)) return;
      txn = r.txnid || '';
      if (r.upi && app !== 'web') {
        /* the chosen app's own link (needed on iPhone); "Other UPI app" opens the phone's UPI chooser */
        var base = r.upi.replace(/^upi:\/\/pay\?/, ''), link = (SCHEME[app] || 'upi://pay?') + base;
        waiting(app); location.href = link; return;
      }
      if (r.payu) {
        var f = document.createElement('form'); f.method = 'POST'; f.action = r.payu.action;
        Object.keys(r.payu.fields).forEach(function (k) { var i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = r.payu.fields[k]; f.appendChild(i); });
        document.body.appendChild(f); f.submit(); return;
      }
      draw(D); err('Could not start the payment. Please try again.');
    }).catch(function () { draw(D); err('Network problem. Please try again.'); });
  }
  function waiting(app) {
    var name = (APPS.filter(function (a) { return a[0] === app; })[0] || [0, 'your UPI app'])[1];
    show('<div class="card" style="text-align:center"><div class="spin"></div><h2>Approve ' + inr(D.payable) + ' in ' + esc(app === 'any' ? 'your UPI app' : name) + '</h2><p class="mut" style="margin-top:8px">Come back here after paying. This page updates by itself.</p><div class="apps"><button type="button" class="y full" id="ikchk">I have paid</button><button type="button" class="full" id="ikback">Choose another way</button></div><div id="ikerr"></div></div>');
    document.getElementById('ikchk').onclick = function () { check(true); };
    document.getElementById('ikback').onclick = function () { stopPoll(); draw(D); };
    stopPoll(); var n = 0; poll = setInterval(function () { if (++n > 100) return stopPoll(); check(false); }, 3000);
  }
  function stopPoll() { clearInterval(poll); poll = null; }
  function check(manual) {
    api({ k: K, op: 'status', txnid: txn }).then(function (r) {
      if (r.state === 'paid') { stopPoll(); states({ ok: true, state: 'paid', order: r.order || D.order, name: r.name || D.name }); }
      else if (r.state === 'failed') { stopPoll(); draw(D); err('The payment did not go through. No money was taken, or your bank will refund it automatically. Try again?'); }
      else if (r.state === 'review') { stopPoll(); msg('Payment received', 'We are confirming it. You will get a WhatsApp message shortly.', '✅'); }
      else if (manual) err('Not received yet. If money was deducted, it shows here within a minute.');
    }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && poll) check(false); });
  if (!/^\d{1,25}-[a-f0-9]{12}$/.test(K)) { msg('Link not valid', 'Please open the link from your WhatsApp message again.', ''); return; }
  if (R === 'failed') { api({ k: K, op: 'info' }).then(function (d) { draw(d); err('The payment did not go through. No money was taken, or your bank will refund it automatically. Try again?'); }); return; }
  api({ k: K, op: 'info' }).then(draw).catch(function () { msg('Something went wrong', 'Please check your connection and open the link again.', ''); });
})();
</script>
